<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #e9f5ff;
            border-left: 5px solid #0078ff;
            border-radius: 5px;
        }

        .result-box h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Mortgage Calculator</h1>

        <label for="state">State</label>
        <select id="state">
            <option value="">Select state</option>
            <option value="TX">Texas (TX)</option>
            <option value="AR">Arkansas (AR)</option>
            <option value="IN">Indiana (IN)</option>
            <option value="IA">Iowa (IA)</option>
            <option value="KS">Kansas (KS)</option>
            <option value="MN">Minnesota (MN)</option>
            <option value="MO">Missouri (MO)</option>
            <option value="WI">Wisconsin (WI)</option>
            <option value="NE">Nebraska (NE)</option>
            <option value="OK">Oklahoma (OK)</option>
        </select>

        <label for="price">Purchase Price</label>
        <input type="number" id="price" placeholder="300000">

        <label for="down">Down Payment (%)</label>
        <input type="number" id="down" placeholder="5">

        <label for="rate">Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="6.5">

        <label for="term">Loan Term (Years)</label>
        <input type="number" id="term" value="30">

        <label for="taxes">Annual Property Taxes ($)</label>
        <input type="number" id="taxes" placeholder="6000">

        <label for="insurance">Annual Home Insurance ($)</label>
        <input type="number" id="insurance" placeholder="1800">

        <button onclick="calculate()">Calculate Payment</button>

        <div id="results" class="result-box" style="display:none;">
            <h2>Monthly Payment Breakdown</h2>
            <p><strong>Principal & Interest:</strong> $<span id="pi"></span></p>
            <p><strong>Taxes:</strong> $<span id="tax"></span></p>
            <p><strong>Insurance:</strong> $<span id="ins"></span></p>
            <hr>
            <h2>Total Monthly Payment: $<span id="total"></span></h2>
        </div>
    </div>

    <script>
        function calculate() {
            const price = parseFloat(document.getElementById("price").value);
            const down = parseFloat(document.getElementById("down").value) / 100;
            const rate = parseFloat(document.getElementById("rate").value) / 100 / 12;
            const term = parseFloat(document.getElementById("term").value) * 12;

            const taxes = parseFloat(document.getElementById("taxes").value) / 12;
            const insurance = parseFloat(document.getElementById("insurance").value) / 12;

            const loanAmount = price - (price * down);

            const pi = (loanAmount * rate) / (1 - Math.pow(1 + rate, -term));

            const total = pi + taxes + insurance;

            document.getElementById("pi").innerText = pi.toFixed(2);
            document.getElementById("tax").innerText = taxes.toFixed(2);
            document.getElementById("ins").innerText = insurance.toFixed(2);
            document.getElementById("total").innerText = total.toFixed(2);

            document.getElementById("results").style.display = "block";
        }
    </script>

</body>
</html
